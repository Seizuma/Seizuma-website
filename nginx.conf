server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # NPM est devant : on récupère la vraie IP du visiteur dans les logs
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;

    location / {
        try_files $uri $uri/ =404;
    }

    # Le HTML doit rester frais : sinon tes mises à jour mettent des jours
    # à apparaître chez les visiteurs qui reviennent.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # CSS/JS peuvent être cachés, mais 1h seulement tant que tu itères.
    # Passe à 30d quand le site sera stable (et pense au cache-busting :
    # style.css?v=2 dans index.html).
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Page 404 personnalisée (à créer plus tard, cf. le 17e secret)
    error_page 404 /404.html;

    # Pas d'accès au .git s'il traîne dans le volume
    location ~ /\.(?!well-known) {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
