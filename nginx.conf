server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Le HTML reste frais, sinon tes mises à jour mettent des jours
    # à apparaître chez les visiteurs qui reviennent.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # CSS/JS : 1h tant que tu itères sur les easter eggs.
    # Passe à 30d quand ce sera stable.
    location ~* \.(css|js)$ {
        expires 1h;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2)$ {
        expires 30d;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;
}
